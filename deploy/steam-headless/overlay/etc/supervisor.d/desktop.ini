[program:desktop]
priority=50
autostart=true
autorestart=true
user=root
directory=/home/%(ENV_USER)s
command=/usr/local/bin/start-desktop-preserve-groups.sh
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s",DISPLAY_SIZEW="%(ENV_DISPLAY_SIZEW)s",DISPLAY_SIZEH="%(ENV_DISPLAY_SIZEH)s",XAUTHORITY="%(ENV_XAUTHORITY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",PUID="%(ENV_PUID)s",PGID="%(ENV_PGID)s",RENDER_DEVICE="%(ENV_RENDER_DEVICE)s"
stopsignal=INT
stdout_logfile=/home/%(ENV_USER)s/.cache/log/desktop.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
stderr_logfile=/home/%(ENV_USER)s/.cache/log/desktop.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=7
